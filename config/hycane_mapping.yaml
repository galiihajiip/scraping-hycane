  trend_history: "Cloud data history"
  ai_anomaly_detection: "AI anomaly detection"
  recommendations: "AI recommendations"
  beginner_mode: "Guided beginner mode"
  reminders: "App reminders"
  diagnostics: "AI/plant diagnostics"
  education: "Education content"
  community: "Community"
  biodegradable_media: "Bagasse biodegradable media"
