- coverage_notes:
    - "No peer-reviewed study in the 677-work index tests sugarcane bagasse as a hydroponic (water-culture) seedling medium; most bagasse hits are mushroom substrates, soil amendments, or ash/biochar. Bagasse-media efficacy for HYCANE is therefore an open technical question (lab validation needed)."
    - "Most Indonesian IoT-hydroponics papers are system builds or community-service reports without controlled user evaluation; they show technical feasibility, not demand."
    - "No academic source in the index measures home growers' willingness to pay for IoT/AI hydroponic kits in Indonesia."
