hypotheses:
  H01:
    verdict: PARTIALLY_SUPPORTED
    rationale: "Discourse is overwhelmingly home/hobby scale (PROFESSIONAL_COMMERCIAL signal ~2% of customer voice) and Indonesian videos frequently frame growing at home, on balconies or narrow land. But only ~4% of records state a home/indoor/small-space context explicitly, and SPACE is almost never voiced as a pain. Small space is a usage context, not a recurring frustration."
    action: "Keep urban/home growers as the core segment, but frame space as a context ('fits a balcony/terrace') rather than the main problem HYCANE solves."
    validation: "Screener in primary survey: dwelling type, growing location, available area."
  H02:
    verdict: SUPPORTED
    rationale: "Among records with an explicit experience signal, ~84% are beginner/never-tried, across all 8 platforms; KNOWLEDGE and PLANT_HEALTH are top-5 pains; Indonesian YouTube comments are dominated by how-to questions and learning intent. Caveat: the beginner rule counts 'belajar/learning', which inflates Indonesian beginner counts."
    action: "Lead with beginner positioning (guided start, fewer failures)."
    validation: "Pilot with first-time growers; measure first-harvest success rate with vs without guidance."
  H03:
    verdict: NOT_ENOUGH_EVIDENCE
    rationale: "Only ~10 records state an age explicitly. Age cannot be inferred from public text without violating the protocol."
    action: "Remove '20–40' as an evidence-based claim; present it as an assumption to test."
    validation: "Age band question in the primary survey."
  H04:
    verdict: PARTIALLY_SUPPORTED
    rationale: "Active Indonesian-language hydroponic discourse exists at scale (~30.7k customer-voice records, mostly YouTube comments on Indonesian tutorials) with distinct themes (AB mix, DIY paralon builds, heat/rain). Java priority cannot be tested: explicit locations are rare (Java place names in ~180 records). Indonesian volume reflects our Indonesian-first YouTube query design, not national prevalence."
    action: "Cite as 'active Indonesian online hydroponic learning community'; do not claim Java market size from this data."
    validation: "Survey/marketplace data by province; YouTube audience analytics of partner channels."
  H05:
    verdict: NOT_ENOUGH_EVIDENCE
    rationale: "No willingness-to-pay can be derived. Price language leans to frugality: 'cheap/murah/DIY' language (~2.3k) far outnumbers premium language (~0.5k); COST is the 2nd most frequent pain; Indonesian price talk centres on DIY component costs (pipes, AB mix, pumps) and start-up capital, and 'I can build it for a fraction' reactions recur. This is a risk signal for a Rp910,000 kit, not a refutation."
    action: "Position against DIY total cost + failure cost; offer an entry tier; keep price claims as hypotheses."
    validation: "Van Westendorp/Gabor-Granger price test; conjoint on kit vs DIY vs media refills."
  H06:
    verdict: PARTIALLY_SUPPORTED
    rationale: "Technology talk (sensors/automation/app/AI) appears on all 8 platforms but in only ~4% of records. Explicit monitoring requests exist (~90). Aspect sentiment on sensors is more negative than positive (calibration, reliability), and a passive/no-electronics preference (Kratky, wick) recurs."
    action: "Treat 'tech-interested' as a sub-segment; sell outcomes (fewer dead plants) rather than technology."
    validation: "Concept test: monitoring kit vs guided passive kit preference."
  H07:
    verdict: NOT_SUPPORTED
    rationale: "Sustainability appears in ~7% of records and is positive in <1%; among purchase-signal records ~11% mention sustainability vs ~33% price/cost. Some skepticism (energy use, 'boros listrik'). Sustainability is a secondary value, not a purchase driver, in this corpus."
    action: "Keep sustainability as a supporting/brand and competition-theme message; do not make it the primary purchase reason."
    validation: "Survey ranking of purchase drivers; A/B message test (sustainability vs ease/success)."
  H08:
    verdict: NOT_ENOUGH_EVIDENCE
    rationale: "School/campus/institution contexts appear in <1% of records. Community and education are, however, the most explicitly requested support features (education ~230 explicit requests on 8 platforms)."
    action: "Use schools/communities as channels and content partners; keep institutional sales as a hypothesis."
    validation: "Interviews with 5–10 school/community program leads."
  H09:
    verdict: PARTIALLY_SUPPORTED
    rationale: "Commercial/business discourse is present (~2% professional signal; Indonesian 'usaha/modal/jual' talk), but restaurants and hotels are rarely mentioned (B2B context ~0.4%). Small hydroponic businesses discuss monitoring time and capital, which fits an SME tier more than hospitality."
    action: "Reframe B2B toward small hydroponic SMEs/farmer groups first; hotels/restaurants as later hypotheses."
    validation: "B2B discovery interviews with 10 hydroponic SMEs."
  H10:
    verdict: NOT_SUPPORTED
    rationale: "Bagasse is almost absent from customer discourse (18 customer-voice mentions out of ~91k). Of 152 bagasse mentions found anywhere, only ~19 are in a growing-media/compost context; most are tableware, packaging, energy or paper. Growers talk about rockwool, coco, perlite, clay pebbles and sponge; rockwool concerns (irritation, pH, waste) appear ~160 times. Bagasse is an engineering/sustainability differentiator, not a value customers currently ask for."
    action: "Sell the medium on performance and convenience (germination, no itch, no disposal hassle, local/cheap), with bagasse as the proof of circularity. Prove it works before claiming it."
    validation: "Lab germination/rooting trials vs rockwool and sponge; blind user trial."
  H11:
    verdict: SUPPORTED
    rationale: "pH and TDS/EC monitoring reach EXPLICIT_REQUEST on ≥6 platforms; PH/EC_TDS/NUTRIENTS pains total ~2.5k records with high severity; TDS/PPM meter and calibration is its own topic. Supported by extension guidance and academic literature. Caveats: calibration burden and sensor reliability are recurring complaints."
    action: "Make pH + TDS/EC monitoring and 'what to do next' guidance the core value; budget for calibration UX and sensor quality."
    validation: "Bench test sensor accuracy (target ±0.2 pH as in the team's own plan) and a 4-week home pilot."
  H12:
    verdict: PARTIALLY_SUPPORTED
    rationale: "Customers rarely ask for 'AI' (explicit AI mentions are few; AI aspect sentiment is split ~22% positive / 23% negative). But the underlying jobs — diagnose what is wrong, tell me what to adjust — are the most frequent pains (PLANT_HEALTH, NUTRIENTS, KNOWLEDGE), and diagnostics is explicitly requested. Demand is for answers, not for AI as such."
    action: "Market 'diagnosis and step-by-step fixes'; mention AI as the mechanism, not the benefit."
    validation: "Wizard-of-Oz test: human-generated recommendations in the app before building ML."
  H13:
    verdict: NOT_ENOUGH_EVIDENCE
    rationale: "Subscription mentions (~860) are mostly about proprietary seed pods/refills; explicit dislike of subscriptions/pod lock-in recurs (~20) and app complaints are about connectivity and missing alerts. AeroGarden's 2024 shutdown announcement (expert stream) shows app/brand continuity risk. No evidence of willingness to pay for premium software."
    action: "Make the kit fully usable without subscription; monetize consumables that are optional/open (media, nutrients) before software."
    validation: "Measure 30-day app retention in pilot; test premium feature uptake with a free trial."

contradictions:
  ANTI_AUTOMATION:
    assumption: "Users need/want automation and sensors"
    examples: "Forum veterans call passive wick/Kratky systems the most reliable and leave them unattended for weeks; Kratky guides promote no-pump, no-electronics growing."
    interpretation: "A strong low-tech, passive-system culture exists, especially among experienced English-speaking hobbyists."
    implication: "Offer a passive/low-power mode; position sensors as optional insight, not a requirement."
  PRICE_OVER_FEATURES:
    assumption: "Middle-market buyers will pay for an integrated kit"
    examples: "Reactions to kit videos: 'I can build this for a fraction of the cost', 'waste of money, I can make it for under $100'."
    interpretation: "DIY substitution is the main competitor; visible hardware is judged on parts cost."
    implication: "Justify price through outcomes (success rate, saved time) and bundled consumables; avoid commodity-looking hardware."
  SOIL_PREFERENCE:
    assumption: "Hydroponics is easier than soil for beginners"
    examples: "Growers report quitting hydro after chasing pH and water temperature without a chiller and returning to soil; mold/algae problems push beginners back."
    interpretation: "Abandonment is driven by the exact chemistry/temperature frictions HYCANE targets."
    implication: "This contradiction doubles as problem validation; measure abandonment reduction in the pilot."
  SUSTAINABILITY_SKEPTIC:
    assumption: "Hydroponics is perceived as sustainable"
    examples: "Indonesian viewers ask whether pumps waste electricity ('boros listrik'); HN/Lemmy debates question vertical-farm energy use."
    interpretation: "Energy use is the main sustainability objection, not growing media."
    implication: "Publish energy use per cycle; prefer low-power pumps/solar options; don't over-claim."
  SUBSCRIPTION_DISLIKE:
    assumption: "Users accept recurring subscriptions/consumables"
    examples: "Smart-garden owners criticise ~$5-per-pod pricing and prefer planting their own seed kits."
    interpretation: "Closed consumable ecosystems trigger resentment."
    implication: "Keep media/nutrient refills open and optional; price refills transparently."
  APP_DISLIKE:
    assumption: "An app improves the experience"
    examples: "Owners report apps that send no alerts unless opened, WiFi disconnections, and buggy updates."
    interpretation: "App reliability failures are noticed and discussed; alerts must work in the background."
    implication: "Prioritize reliable push alerts and offline operation over dashboard features."
  SENSOR_DISTRUST:
    assumption: "Sensor readings are trusted"
    examples: "DIY builders struggle with pH probes drying out, zeroing signal boards and replacement probes."
    interpretation: "Low volume but concentrated among technical users; calibration is a known pain."
    implication: "Calibration guidance and probe replacement/consumable plan."
  AI_SKEPTICISM:
    assumption: "AI adds value"
    examples: "A hydroponics business owner doubts AI improves growing beyond what scale already solves."
    interpretation: "Very rare in corpus; AI is mostly not discussed at all."
    implication: "Do not lead with AI claims."

contradictions_extra:
  - contradiction_id: MARKET_AEROGARDEN_SHUTDOWN
    assumption_challenged: "Consumer smart-hydroponic kits are a durable business"
    n_customer_voice: "expert stream"
    evidence_level: E3
    interpretation: "Scotts Miracle-Gro announced in Nov 2024 it would shut down AeroGarden (EX006), later relaunched in 2025 (EX007)."
    implication: "Plan for app/brand continuity and a non-app fallback; show unit economics."
  - contradiction_id: ACADEMIC_SENSOR_LIMITS
    assumption_challenged: "Sensors + automated dosing solve nutrient management"
    n_customer_voice: "expert/academic stream"
    evidence_level: E5
    interpretation: "UF/IFAS (EX005) and a 2023 review (W4388723157) note EC-based dosing is imprecise and can waste nutrients."
    implication: "Recommendations must be crop- and stage-aware; avoid 'fully automatic' claims."
  - contradiction_id: ACADEMIC_BAGASSE_GAP
    assumption_challenged: "Bagasse media performance is established"
    n_customer_voice: "academic stream"
    evidence_level: E5
    interpretation: "No study in the index tests bagasse as a water-culture hydroponic medium; nearest analogues are soilless tomato substrates (W4293085516) and date-palm waste vs rockwool (W4390103616)."
    implication: "Lab validation is a prerequisite for media claims."

